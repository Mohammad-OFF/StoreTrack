version: "3.9"

services:
  app:
    build: .
    container_name: storetrack_app
    restart: unless-stopped
    environment:
      DB_HOST: host.docker.internal
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: storage_db
      PORT: 3000
    ports:
      - "3000:3000"

  app:
    build: .
    container_name: storetrack_app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: storage_db
    ports:
      - "3000:3000"
    networks:
      - storetrack_net

volumes:
  mysql_data:

networks:
  storetrack_net:
