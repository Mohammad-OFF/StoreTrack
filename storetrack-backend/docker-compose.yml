version: "3.9"

services:
  mysql:
    image: mariadb:10.5
    container_name: storetrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: storage_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - storetrack_net

  app:
    build: .
    container_name: storetrack_app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: storage_db
    ports:
      - "3000:3000"
    networks:
      - storetrack_net

volumes:
  mysql_data:

networks:
  storetrack_net:
